name: Daily Newsletter

on:
  schedule:
    # 7:00 AM IST = 1:30 AM UTC
    - cron: '30 1 * * *'
  workflow_dispatch: # allow manual trigger

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Send daily newsletter
        run: |
          curl -f -X POST \
            -H "Authorization: Bearer ${{ secrets.NEWSLETTER_SECRET_KEY }}" \
            -H "Content-Type: application/json" \
            https://panchranga.vercel.app/api/newsletter/send
